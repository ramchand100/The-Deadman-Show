title_options = [
  "Isaac Newton: The Apple Myth, Bitter Rivals and a Mouse Called Miller",
  "Isaac Newton Was Never Hit by an Apple. Here's What He Remembers",
  "Isaac Newton Reacts to the Moon Landing, Satellites and Einstein",
  "Did Newton Predict the End of the World? He Answers",
  "Isaac Newton on Genius, Rivals and the Letters He Regretted",
]
thumbnail_text = ["NO APPLE?", "END OF THE WORLD?", "I FRAME NO HYPOTHESES"]
description = "Ram sits down with an AI recreation of Sir Isaac Newton, the man who explained gravity and light. Newton talks about the mouse that ran his model windmill, the paper kites that made Lincolnshire villagers think comets were coming, the plague years at Woolsthorpe, what he really remembers about the apple, why he hid his Moon calculation for years, and the quarrels with Hooke and Leibniz that he never forgave.\n\nHe explains his prism experiment and his laws of motion simply, admits he never knew what gravity is, reads from the 1693 letters he wrote after days without sleep, reacts to satellites, the Moon landings and Einstein, and answers the internet's claim that he predicted the end of the world. Sir Isaac Newton in this episode is an AI recreation built from his own writings and public-domain biographies by David Brewster (1831) and N. W. Chittenden (1846); his direct quotations come word for word from those sources."
cold_open_from = "So no apple?"
cold_open_to = "I did not say no apple."

