title_options = ["Adam Smith: The Bored Tutor Who Invented Economics", "Adam Smith Was Never Pro-Greed. Here's What He Really Said", "The Father of Economics on Money, Happiness and Regret", "Adam Smith Reacts to AI, Influencers and Modern India", "Kidnapped at 3, Burned His Unfinished Work at 67: Adam Smith"]
thumbnail_text = ["HE WAS BORED", "NOT PRO-GREED", "BURN IT ALL"]
description = "Ram sits down with an AI recreation of Adam Smith, the Scottish philosopher who wrote The Wealth of Nations. They cover his kidnapping by gipsies at age three, being punished at Oxford for reading David Hume, starting the most famous economics book in history because he was bored in Toulouse, his friendship with Hume, a love he never explained, and why he had sixteen volumes of his own work burned a week before he died.\n\nSmith also explains what people get wrong about the invisible hand, why chasing wealth can cost you your peace of mind, what he thought of the East India Company in Bengal, and how he'd judge AI, influencers and modern India. Adam Smith in this episode is an AI recreation built from his own writings and John Rae's public-domain biography (1895). His direct quotations come word for word from those sources."
cold_open_from = "Hold on. That book was The"
cold_open_to = "Boredom is badly underrated. Every man"

